<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servicio semanal</title>
<style>
  :root{
    --paper: #FBF7F0;
    --ink: #2B2620;
    --line: #DCD3C2;
    --accent: #2E6F5E;
    --accent-soft: #E4EFEA;
    --gold: #B98B3E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 48px 20px 80px;
  }
  .sheet{
    width:100%;
    max-width:640px;
  }
  .eyebrow{
    font-family: "Courier New", monospace;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:12px;
    color: var(--gold);
    margin-bottom:8px;
  }
  h1{
    font-size: 30px;
    margin: 0 0 4px;
    font-weight:600;
  }
  .sub{
    color:#6b6152;
    font-size:14px;
    margin-bottom:32px;
  }
  .field{
    margin-bottom:22px;
  }
  label{
    display:block;
    font-family:"Courier New", monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#8a7f6a;
    margin-bottom:6px;
  }
  select{
    width:100%;
    padding:12px 14px;
    font-family: inherit;
    font-size:16px;
    background: #fff;
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--ink);
    appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%232E6F5E' stroke-width='2' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat:no-repeat;
    background-position: right 14px center;
  }
  .buttons{
    display:flex;
    gap:12px;
    margin: 28px 0 32px;
  }
  button{
    font-family: inherit;
    font-size:15px;
    padding:12px 20px;
    border-radius:6px;
    border:1px solid var(--accent);
    cursor:pointer;
    transition: transform .12s ease, background .15s ease;
  }
  button:active{ transform: scale(0.97); }
  .btn-primary{
    background: var(--accent);
    color:#fff;
    flex:1;
  }
  .btn-primary:hover{ background:#255c4d; }
  .btn-secondary{
    background: transparent;
    color: var(--accent);
  }
  .btn-secondary:hover{ background: var(--accent-soft); }
  .btn-secondary.copied{
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .divider{
    height:1px;
    background: var(--line);
    margin: 0 0 28px;
  }
  .result-label{
    font-family:"Courier New", monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#8a7f6a;
    margin-bottom:10px;
  }
  .result-box{
    background: #fff;
    border: 1px solid var(--line);
    border-radius:8px;
    padding: 24px 24px;
    white-space: pre-wrap;
    font-size:16px;
    line-height:1.65;
    min-height: 140px;
  }
  .result-box strong{ font-weight:700; }
  .placeholder{
    color:#b3aa96;
    font-style: italic;
  }
  .footnote{
    margin-top:18px;
    font-size:12px;
    color:#9c927c;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="eyebrow">Anuncio semanal</div>
    <h1>Generador de texto para la salida al servicio</h1>
    <div class="sub">Elige la casa de salida y genera una combinación aleatoria del anuncio, lista para copiar.</div>

    <div class="field">
      <label for="familia">Casa de salida 🏡</label>
      <select id="familia">
        <option value="*Familia Castillo Cázares*">Familia Castillo Cázares</option>
        <option value="*Familia Ocampo Pérez*">Familia Ocampo Pérez</option>
        <option value="*Familia Quintero López*">Familia Quintero López</option>
        <option value="*Familia Pérez García*">Familia Pérez García</option>
      </select>
    </div>

    <div class="buttons">
      <button class="btn-primary" id="generar">Generar texto</button>
      <button class="btn-secondary" id="copiar">Copiar</button>
    </div>

    <div class="divider"></div>

    <div class="result-label">Resultado</div>
    <div class="result-box" id="resultado"><span class="placeholder">Pulsa «Generar texto» para crear el anuncio…</span></div>
    <div class="footnote" id="footnote"></div>
  </div>

<script>
const A = ['☀️','☕','⚡','🌟','🌷','🌼','🎒','🎯','🏆','💥','📌','📢','📢','📣','🔑','🔥','🕊️','🗓️','🥳','🚀'];

const B = [
  "*¡Hola, queridísimos hermanos!*",
  "*¡Muy buenos días, queridísimos hermanos!*",
  "*¡Muy buenos días, queridos hermanos!*",
  "*¡Muy buenos días, hermanos queridos!*",
  "*¡Hola, queridísimos hermanos!*",
  "*¡Muy buen día, queridísimos hermanos!*",
  "*¡Muy buen día, queridos hermanos!*",
  "*¡Muy buen día, hermanos queridos!*"
];

const C = [
  "La salida a la predicación esta semana será desde la casa de la ",
  "La salida a la predicación esta semana es desde la casa de la ",
  "La salida a la predicación durante esta semana será desde la casa de la ",
  "La salida a la predicación durante esta semana es desde la casa de la "
];

const E = [
  "Excelente semana a todos",
  "Excelente semana para todos",
  "Linda semana a todos",
  "Linda semana para todos"
];

const F = ["💥📖","💼🚗","📖✨","🤝✨","🚀🔥","🏡✨","🏡💼","👋🏽⚡","👋🏽✨","👋🏽❤️","👋🏽🎉","👋🏽🔥","👋🏽🚗","🚗💼"];

function pick(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

function mdToHtml(str){
  // convierte *negritas* a <strong> para la vista previa
  return str.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

let plainText = "";

function generar(){
  const D = document.getElementById('familia').value;

  const a = pick(A);
  const b = pick(B);
  const c = pick(C);
  const e = pick(E);
  const f = pick(F);

  plainText = `${a}${b}\n\n${c}${D}\n\n${e}${f}`;

  const htmlText = mdToHtml(plainText).replace(/\n/g, '<br>');
  document.getElementById('resultado').innerHTML = htmlText;

  const copiarBtn = document.getElementById('copiar');
  copiarBtn.classList.remove('copied');
  copiarBtn.textContent = 'Copiar';
}

async function copiar(){
  if(!plainText) return;
  try{
    await navigator.clipboard.writeText(plainText);
    const copiarBtn = document.getElementById('copiar');
    copiarBtn.textContent = '¡Copiado!';
    copiarBtn.classList.add('copied');
    setTimeout(() => {
      copiarBtn.textContent = 'Copiar';
      copiarBtn.classList.remove('copied');
    }, 1600);
  }catch(err){
    alert('No se pudo copiar automáticamente. Selecciona y copia el texto manualmente.');
  }
}

document.getElementById('generar').addEventListener('click', generar);
document.getElementById('copiar').addEventListener('click', copiar);

// genera un texto inicial al cargar
generar();
</script>
</body>
</html>
